type: object
required:
  - _id
  - name
  - email
  - password
properties:
  _id:
    description: "User's id"
    type: string
    example: '67f55334aee013d9c030b440'
  name:
    description: "User's name"
    type: string
    example: 'Amur Dog'
  email:
    description: "User's email"
    type: string
    example: 'amur@example.com'
  password:
    description: "User's password"
    type: string
    example: 'Str0ngPas5w0rd'